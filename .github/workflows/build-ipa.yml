name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and sync Capacitor iOS
        run: |
          npm install
          npx cap sync ios

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Spotify.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Spotify.ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Spotify.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r Spotify.ipa Payload

      - name: Upload Spotify.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-iOS-IPA
          path: build/Spotify.ipa
